<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Incident Intelligence Console</title>
    <style>
      :root {
        --bg: #060c18;
        --card: #0d1a33;
        --line: rgba(255, 255, 255, 0.08);
        --text: #e9f0ff;
        --muted: #9bb0d3;
        --green: #4dd99a;
        --amber: #ffba49;
        --red: #ff6978;
        --cyan: #5fc5ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 8% 0%, rgba(95, 197, 255, 0.15), transparent 50%),
          radial-gradient(circle at 100% 0%, rgba(255, 105, 120, 0.12), transparent 50%),
          var(--bg);
      }
      .wrap { width: min(1180px, 94vw); margin: 22px auto 34px; }
      h1 { margin: 0; font-size: 2rem; }
      .sub { color: var(--muted); margin-top: 5px; }
      .row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .k { color: var(--muted); font-size: 0.8rem; }
      .v { font-size: 1.9rem; font-weight: 700; margin-top: 3px; }
      .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; margin-top: 12px; }
      .tbl { width: 100%; border-collapse: collapse; }
      .tbl th, .tbl td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); font-size: 0.86rem; }
      .badge { padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; }
      .sev-critical { background: rgba(255, 105, 120, 0.2); color: #ffc2cb; }
      .sev-high { background: rgba(255, 186, 73, 0.22); color: #ffdca4; }
      .sev-medium { background: rgba(95, 197, 255, 0.18); color: #cdeeff; }
      .sev-low { background: rgba(77, 217, 154, 0.18); color: #bcffe1; }
      .feed { max-height: 410px; overflow: auto; }
      .event { border-bottom: 1px solid var(--line); padding: 8px 0; }
      .event small { color: var(--muted); }
      @media (max-width: 980px) {
        .row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .layout { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1>Incident Intelligence Console</h1>
      <div class="sub">Realtime incident clustering, deploy regression signals, triage metrics</div>

      <section class="row">
        <article class="card"><div class="k">Open Incidents</div><div class="v" id="openInc">-</div></article>
        <article class="card"><div class="k">Mitigated</div><div class="v" id="mitigated">-</div></article>
        <article class="card"><div class="k">Mean Confidence</div><div class="v" id="conf">-</div></article>
        <article class="card"><div class="k">Est. MTTR (min)</div><div class="v" id="mttr">-</div></article>
      </section>

      <section class="layout">
        <article class="card">
          <h3 style="margin-top:0;">Active Incidents</h3>
          <table class="tbl">
            <thead>
              <tr><th>ID</th><th>Service</th><th>Severity</th><th>Status</th><th>Confidence</th><th>Events</th></tr>
            </thead>
            <tbody id="incRows"></tbody>
          </table>
        </article>

        <article class="card">
          <h3 style="margin-top:0;">Live Event Feed</h3>
          <div id="feed" class="feed"></div>
        </article>
      </section>
    </main>

    <script>
      const API = "http://127.0.0.1:9000";

      function sevClass(sev) {
        if (sev === "critical") return "sev-critical";
        if (sev === "high") return "sev-high";
        if (sev === "medium") return "sev-medium";
        return "sev-low";
      }

      async function refresh() {
        const [stats, incidents] = await Promise.all([
          fetch(`${API}/triage/stats`).then((r) => r.json()),
          fetch(`${API}/incidents`).then((r) => r.json()),
        ]);

        document.getElementById("openInc").textContent = stats.open_incidents;
        document.getElementById("mitigated").textContent = stats.mitigated_incidents;
        document.getElementById("conf").textContent = stats.mean_confidence.toFixed(2);
        document.getElementById("mttr").textContent = stats.mttr_minutes_estimate.toFixed(1);

        const tbody = document.getElementById("incRows");
        tbody.innerHTML = "";
        for (const x of incidents.slice(0, 18)) {
          const tr = document.createElement("tr");
          tr.innerHTML = `<td>#${x.id}</td><td>${x.service}</td><td><span class="badge ${sevClass(x.severity)}">${x.severity}</span></td><td>${x.status}</td><td>${x.confidence.toFixed(2)}</td><td>${x.linked_events}</td>`;
          tbody.appendChild(tr);
        }
      }

      function bindWs() {
        const ws = new WebSocket("ws://127.0.0.1:9000/ws");
        ws.onopen = () => ws.send("sub");
        ws.onmessage = (evt) => {
          const data = JSON.parse(evt.data);
          const feed = document.getElementById("feed");
          const row = document.createElement("div");
          row.className = "event";
          row.innerHTML = `<div><b>${data.service}</b> ${data.level}</div><small>incident #${data.incident_id}${data.regression_score ? ` | regression ${data.regression_score}` : ""}</small>`;
          feed.prepend(row);
          while (feed.children.length > 50) feed.removeChild(feed.lastChild);
          refresh().catch(() => {});
        };
        ws.onclose = () => setTimeout(bindWs, 1200);
      }

      refresh().catch(() => {});
      setInterval(() => refresh().catch(() => {}), 5000);
      bindWs();
    </script>
  </body>
</html>
